<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .color-bars {
            display: flex;
            height: 5px;
            margin-bottom: 20px;
        }
        .color-bar {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-container">
            <div class="text-center mb-4">
                <h2>Please Sign Up</h2>
                <p class="text-muted">It's free and always will be.</p>
            </div>
            
            <div class="color-bars">
                <div class="color-bar" style="background-color: #f3c22c;"></div>
                <div class="color-bar" style="background-color: #f38a2c;"></div>
                <div class="color-bar" style="background-color: #e84a5f;"></div>
                <div class="color-bar" style="background-color: #55c1e5;"></div>
                <div class="color-bar" style="background-color: #63d471;"></div>
            </div>

            <form>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="First Name">
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Last Name">
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Display Name">
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Email Address">
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="password" class="form-control" placeholder="Password">
                    </div>
                    <div class="col-md-6">
                        <input type="password" class="form-control" placeholder="Confirm Password">
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" value="" id="agreeCheck">
                    <label class="form-check-label" for="agreeCheck">
                        By clicking <a href="#">Register</a>, you agree to the <a href="#">Terms and Conditions</a> set out by this site, including our Cookie Use.
                    </label>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary px-4">Register</button>
                    <button type="button" class="btn btn-success px-4">Sign In</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
