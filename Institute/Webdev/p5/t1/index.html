<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi Mahasiswa</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Form Registrasi</h1>
        <p class="text-center text-gray-500 mb-8">Isi data mata kuliah yang akan diambil.</p>

        <!-- Pesan status untuk sukses atau error global -->
        <div id="status-message" class="mb-4 text-center"></div>

        <form id="registration-form" class="space-y-6" novalidate>
            <!-- Input Nama Mahasiswa dengan Rekomendasi -->
            <div class="relative">
                <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Mahasiswa</label>
                <input type="text" id="nama" name="nama" placeholder="Ketik nama Anda, misal 'Bu...'" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                <!-- Kontainer untuk menampilkan rekomendasi nama -->
                <div id="nama-suggestions" class="absolute z-10 w-full bg-white border border-gray-200 rounded-b-lg mt-1 shadow-md hidden"></div>
                <div id="nama-error" class="error-message text-red-500 text-xs mt-1"></div>
            </div>

            <!-- Input NIM -->
            <div>
                <label for="nim" class="block text-sm font-medium text-gray-700 mb-1">NIM (Nomor Induk Mahasiswa)</label>
                <input type="text" id="nim" name="nim" placeholder="Contoh: 5025211001" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                <div id="nim-error" class="error-message text-red-500 text-xs mt-1"></div>
            </div>

            <!-- Input Mata Kuliah -->
            <div>
                <label for="matkul" class="block text-sm font-medium text-gray-700 mb-1">Mata Kuliah</label>
                <input type="text" id="matkul" name="matkul" placeholder="Contoh: Pemrograman Web" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                <div id="matkul-error" class="error-message text-red-500 text-xs mt-1"></div>
            </div>

            <!-- Input Dosen -->
            <div>
                <label for="dosen" class="block text-sm font-medium text-gray-700 mb-1">Dosen Pengampu</label>
                <input type="text" id="dosen" name="dosen" placeholder="Contoh: Dr. Agus" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                <div id="dosen-error" class="error-message text-red-500 text-xs mt-1"></div>
            </div>

            <!-- Tombol Submit -->
            <div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
                    Daftar
                </button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
